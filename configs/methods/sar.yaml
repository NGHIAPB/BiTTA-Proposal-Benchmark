# SAR (Niu et al., 2023) — entropy minimization co sharpness-aware, dong bang layer cuoi.
method: SAR
binary_feedback: true   # --enable_bitta ("TENT*/EATA*/SAR*" cua paper), chay bang scripts/run_bitta_family.sh
model: resnet18
epoch: 1
lr: 0.00025
sar_margin_e0_coeff: 0.4   # E0 = coeff * ln(num_class)
sharpness_rho: 0.5
freeze_top_layer: true
extra_flags: []
