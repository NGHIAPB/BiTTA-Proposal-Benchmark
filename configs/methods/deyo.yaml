# DeYO (Lee et al., ICLR 2024) — Entropy + PLPD (Pseudo-Label Probability Difference).
# Runner RIENG: src/methods/deyo/main.py (kien truc goc cua tac gia, KHONG dung chung
# pipeline continual online cua BiTTA-family vi cau truc adapt() khac biet ro ret).
method: DeYO
model: resnet18_bn
aug_type: patch        # patch | pixel | occ  (patch cho ket qua tot nhat theo paper)
patch_len: 4
deyo_margin_coeff: 0.5    # tau_Ent = coeff * ln(num_class)
deyo_margin_e0_coeff: 0.4 # Ent0 = coeff * ln(num_class)
plpd_threshold: 0.2       # tau_PLPD
lr_resnet18: 0.00025
sar_margin_e0_coeff: 0.4
